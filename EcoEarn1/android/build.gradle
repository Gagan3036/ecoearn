
buildscript {
    repositories {
        google()  // ✅ Required for Android Gradle Plugin
        mavenCentral()  // ✅ Required for dependencies like Firebase
    }
    
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2' // ✅ Compatible with Gradle 8.10.2
        classpath 'com.google.gms:google-services:4.3.15' // ✅ Firebase Plugin
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}


